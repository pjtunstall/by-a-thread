services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=1
      - DELETE=1
      - NETWORKS=1
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M

  matchmaker:
    image: pjtunstall/matchmaker-image:latest
    container_name: matchmaker-container
    restart: unless-stopped
    cpu_shares: 2048
    env_file: .env.matchmaker
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - GAME_IMAGE=pjtunstall/server-image:latest
    depends_on:
      - socket-proxy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 256M

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
