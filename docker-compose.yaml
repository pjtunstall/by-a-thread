services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=1
      - DELETE=1
      - NETWORKS=1
      - TZ=UTC
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M
          pids: 256

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TZ=UTC
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 256

  matchmaker:
    image: pjtunstall/matchmaker-image:latest
    container_name: matchmaker-container
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env.matchmaker
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - GAME_IMAGE=${GAME_IMAGE}
      - TZ=UTC
    depends_on:
      - socket-proxy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 256M
          pids: 256

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
