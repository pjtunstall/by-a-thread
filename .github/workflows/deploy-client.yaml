name: Deploy Client to itch.io

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy_itch

jobs:
  deploy-itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version for itch.io display
        id: version
        run: |
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="client").version')
          if [ -n "$V" ] && [ "$V" != "null" ]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yaml
          branch: main
          path: assets

      - name: Download butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler

      - name: Fix Permissions
        run: |
          find assets -name '*.AppImage' -exec chmod +x {} \;

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GAME: ${{ secrets.ITCH_USERNAME }}/${{ secrets.ITCH_GAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          if [ -z "$VERSION" ]; then
            echo "::warning::Deploy version is empty (cargo metadata may have failed); itch.io will not show a version for these builds."
            echo "Pushing with userversion: <none>"
          else
            echo "Pushing with userversion: $VERSION"
          fi
          UV=""
          [ -n "$VERSION" ] && UV="--userversion $VERSION"

          for file in assets/windows-package/*.zip; do
            ./butler push $UV "$file" $GAME:windows
          done

          for file in assets/linux-packages/*.AppImage; do
            ./butler push $UV "$file" $GAME:linux
          done

          for file in assets/linux-packages/*.deb; do
            ./butler push $UV "$file" $GAME:linux-deb
          done

          for file in assets/linux-packages/*.rpm; do
            ./butler push $UV "$file" $GAME:linux-rpm
          done

          for file in assets/macos-packages/*.zip; do
            if [[ "$file" == *"intel"* ]] || [[ "$file" == *"x86_64"* ]]; then
              ./butler push $UV "$file" $GAME:mac-intel
            elif [[ "$file" == *"silicon"* ]] || [[ "$file" == *"aarch64"* ]]; then
              ./butler push $UV "$file" $GAME:mac-apple
            else
              ./butler push $UV "$file" $GAME:mac
            fi
          done
